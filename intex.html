<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Jarvis AI - Your Personal Web Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .assistant-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        /* Chat Area */
        .chat-area {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            justify-content: flex-end;
        }

        .assistant-message {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            word-wrap: break-word;
        }

        .user-message .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .assistant-message .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .voice-btn {
            background: #ff6b6b;
            color: white;
        }

        .voice-btn.listening {
            background: #ff4757;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-btn {
            padding: 8px 15px;
            background: #f0f0f0;
            color: #667eea;
            font-size: 0.9em;
        }

        /* Typing indicator */
        .typing {
            display: none;
            padding: 10px 20px;
            background: white;
            border-radius: 20px;
            width: fit-content;
            margin-bottom: 15px;
        }

        .typing.active {
            display: block;
        }

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="assistant-container">
        <div class="header">
            <div class="avatar">🤖</div>
            <h1>Jarvis Assistant</h1>
            <p>Your intelligent web companion</p>
            <div class="status-badge" id="statusBadge">🟢 Ready</div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message assistant-message">
                <div class="message-content">
                    Hello! I'm Jarvis, your web assistant. 👋<br>
                    I can help you with:<br>
                    • Opening websites (Google, YouTube, GitHub, etc.)<br>
                    • Telling time and date<br>
                    • Simple calculations<br>
                    • Weather information<br>
                    • And more!<br><br>
                    Try typing or using voice 🎤
                </div>
            </div>
        </div>

        <div class="typing" id="typingIndicator">
            <span></span><span></span><span></span>
        </div>

        <div class="input-area">
            <div class="input-group">
                <input type="text" id="userInput" placeholder="Type your command..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="processUserInput()">Send 📤</button>
                <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceInput()">🎤 Voice</button>
            </div>
            <div class="quick-actions">
                <button class="quick-btn" onclick="quickCommand('open google')">🌐 Google</button>
                <button class="quick-btn" onclick="quickCommand('open youtube')">📺 YouTube</button>
                <button class="quick-btn" onclick="quickCommand('what time is it')">⏰ Time</button>
                <button class="quick-btn" onclick="quickCommand('what day is it')">📅 Date</button>
                <button class="quick-btn" onclick="quickCommand('calculate 5 + 3')">🧮 Calculator</button>
            </div>
        </div>
    </div>

    <script>
        // ========== WEB ASSISTANT CORE ==========
        
        // Speech setup
        let isListening = false;
        let recognition = null;
        
        // Initialize speech recognition if available
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                updateStatus('🎤 Heard: "' + transcript + '"');
                processUserInput(transcript);
                stopVoiceInput();
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                updateStatus('❌ Voice error: ' + event.error);
                stopVoiceInput();
                speak("Sorry, I couldn't hear you clearly. Please try again.");
            };
            
            recognition.onend = () => {
                stopVoiceInput();
            };
        } else {
            console.warn('Speech recognition not supported');
            document.getElementById('voiceBtn').disabled = true;
            document.getElementById('voiceBtn').title = 'Voice not supported in this browser';
        }
        
        // Speak function using Web Speech API
        function speak(text) {
            if (!window.speechSynthesis) {
                console.warn('Speech synthesis not supported');
                return;
            }
            
            // Cancel any ongoing speech
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            
            // Try to use a female voice if available
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(voice => voice.name.includes('Google UK Female') || voice.name.includes('Samantha'));
            if (femaleVoice) utterance.voice = femaleVoice;
            
            utterance.onstart = () => {
                updateStatus('🔊 Speaking...');
            };
            
            utterance.onend = () => {
                updateStatus('🟢 Ready');
            };
            
            window.speechSynthesis.speak(utterance);
        }
        
        // Update status badge
        function updateStatus(message) {
            const badge = document.getElementById('statusBadge');
            badge.textContent = message;
            setTimeout(() => {
                if (badge.textContent === message) {
                    badge.textContent = '🟢 Ready';
                }
            }, 3000);
        }
        
        // Add message to chat
        function addMessage(text, isUser) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = text;
            
            messageDiv.appendChild(content);
            chatArea.appendChild(messageDiv);
            
            // Scroll to bottom
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // Show typing indicator
        function showTyping(show) {
            const indicator = document.getElementById('typingIndicator');
            if (show) {
                indicator.classList.add('active');
            } else {
                indicator.classList.remove('active');
            }
        }
        
        // Process commands - MAIN LOGIC
        async function processUserInput(inputText = null) {
            const input = inputText || document.getElementById('userInput').value;
            if (!input.trim()) {
                speak("Please say or type something.");
                return;
            }
            
            // Clear input
            document.getElementById('userInput').value = '';
            
            // Add user message
            addMessage(input, true);
            
            // Show typing indicator
            showTyping(true);
            
            // Process command
            setTimeout(async () => {
                const response = await processCommand(input.toLowerCase());
                showTyping(false);
                addMessage(response.text, false);
                speak(response.text);
                
                // Execute actions (like opening websites)
                if (response.action) {
                    executeAction(response.action);
                }
            }, 500);
        }
        
        // Command processor
        async function processCommand(query) {
            // Website opening commands
            const websites = {
                'google': 'https://www.google.com',
                'youtube': 'https://www.youtube.com',
                'github': 'https://github.com',
                'gmail': 'https://mail.google.com',
                'deepseek': 'https://www.deepseek.com',
                'spotify': 'https://open.spotify.com',
                'facebook': 'https://www.facebook.com',
                'twitter': 'https://twitter.com',
                'instagram': 'https://www.instagram.com',
                'linkedin': 'https://www.linkedin.com',
                'reddit': 'https://www.reddit.com',
                'amazon': 'https://www.amazon.com',
                'netflix': 'https://www.netflix.com'
            };
            
            // Check for website opening
            for (const [site, url] of Object.entries(websites)) {
                if (query.includes(`open ${site}`) || query.includes(`go to ${site}`)) {
                    return {
                        text: `Opening ${site.charAt(0).toUpperCase() + site.slice(1)} for you.`,
                        action: { type: 'openUrl', url: url }
                    };
                }
            }
            
            // Time and date
            if (query.includes('what time') || query.includes('current time')) {
                const now = new Date();
                const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                return { text: `The current time is ${time}.`, action: null };
            }
            
            if (query.includes('what day') || query.includes('today\'s date') || query.includes('date today')) {
                const now = new Date();
                const date = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                return { text: `Today is ${date}.`, action: null };
            }
            
            // Calculations
            if (query.includes('calculate') || query.includes('what is') && (query.includes('+') || query.includes('-') || query.includes('*') || query.includes('/'))) {
                try {
                    // Extract math expression
                    let expression = query.replace('calculate', '').replace('what is', '').trim();
                    // Evaluate safely
                    const result = Function('"use strict";return (' + expression + ')')();
                    return { text: `The answer is ${result}.`, action: null };
                } catch (e) {
                    return { text: "Sorry, I couldn't calculate that. Please try a simple expression like '5 + 3'.", action: null };
                }
            }
            
            // Weather (demo - would need API key for real data)
            if (query.includes('weather')) {
                return { 
                    text: "I can show you weather information! For accurate weather data, I'd need an API key. Would you like me to open a weather website for you?",
                    action: { type: 'openUrl', url: 'https://weather.com' }
                };
            }
            
            // Search the web
            if (query.includes('search for') || query.includes('search')) {
                let searchTerm = query.replace('search for', '').replace('search', '').trim();
                if (searchTerm) {
                    return {
                        text: `Searching Google for "${searchTerm}".`,
                        action: { type: 'openUrl', url: `https://www.google.com/search?q=${encodeURIComponent(searchTerm)}` }
                    };
                }
            }
            
            // Help
            if (query.includes('help') || query.includes('what can you do')) {
                return {
                    text: "I can help you with:\n• Opening websites (say 'open Google')\n• Telling time and date\n• Doing calculations (say 'calculate 10 * 5')\n• Searching the web (say 'search for cute cats')\n• And more! What would you like me to do?",
                    action: null
                };
            }
            
            // Greetings
            if (query.includes('hello') || query.includes('hi') || query.includes('hey')) {
                return { text: "Hello! How can I help you today?", action: null };
            }
            
            if (query.includes('how are you')) {
                return { text: "I'm doing great, thank you for asking! Ready to assist you.", action: null };
            }
            
            // Default response
            return {
                text: "I'm not sure how to help with that. Try saying 'help' to see what I can do, or try 'open google' to open a website.",
                action: null
            };
        }
        
        // Execute actions (like opening URLs)
        function executeAction(action) {
            if (action && action.type === 'openUrl') {
                window.open(action.url, '_blank');
            }
        }
        
        // Voice input controls
        function toggleVoiceInput() {
            if (isListening) {
                stopVoiceInput();
            } else {
                startVoiceInput();
            }
        }
        
        function startVoiceInput() {
            if (!recognition) {
                speak("Sorry, voice recognition is not supported in your browser.");
                return;
            }
            
            try {
                recognition.start();
                isListening = true;
                const voiceBtn = document.getElementById('voiceBtn');
                voiceBtn.classList.add('listening');
                voiceBtn.textContent = '🔴 Listening...';
                updateStatus('🎤 Listening... Speak now');
                speak("Listening...");
            } catch (error) {
                console.error('Failed to start recognition:', error);
                updateStatus('❌ Failed to start voice input');
            }
        }
        
        function stopVoiceInput() {
            if (recognition && isListening) {
                try {
                    recognition.stop();
                } catch (e) {}
                isListening = false;
                const voiceBtn = document.getElementById('voiceBtn');
                voiceBtn.classList.remove('listening');
                voiceBtn.textContent = '🎤 Voice';
            }
        }
        
        // Handle enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                processUserInput();
            }
        }
        
        // Quick command
        function quickCommand(command) {
            document.getElementById('userInput').value = command;
            processUserInput();
        }
        
        // Load voices when ready
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
        
        // Focus input on load
        document.getElementById('userInput').focus();
        
        // Add welcome message with voice
        setTimeout(() => {
            speak("Hello! I'm Jarvis, your web assistant. How can I help you today?");
        }, 500);
    </script>
</body>
</html>
